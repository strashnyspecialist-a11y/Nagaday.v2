name: Check reminders and notify

on:
  schedule:
    # GitHub Actions cron runs in UTC. Every 5 minutes (GitHub's minimum granularity).
    - cron: '*/5 * * * *'
  workflow_dispatch: {}  # lets you run it manually from the Actions tab to test

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Warsaw
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_and_notify.py
