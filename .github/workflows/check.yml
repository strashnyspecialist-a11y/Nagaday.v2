name: Перевірка нагадувань і сповіщення в Telegram

on:
  schedule:
    # Кожні 5 хвилин (UTC). GitHub може запускати з невеликою затримкою.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # дозволяє запустити вручну з вкладки Actions

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Перевірити нагадування та надіслати в Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
        run: python check_and_notify.py
